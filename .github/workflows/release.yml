name: Multi-Platform Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Rouen ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            # Rouen Cross-Platform Release ${{ github.event.inputs.tag_name || github.ref_name }}
            
            This release includes builds for all supported platforms:
            - **Windows** (x64) - MSI installer with automatic dependency management
            - **macOS** (Universal Binary) - DMG installer with Apple Silicon and Intel support  
            - **Linux** (x64) - Portable archive with Nix-based reproducible build
            
            ## Installation Instructions
            
            ### Windows
            1. Download `rouen-windows-x64.msi`
            2. Run the installer (no admin rights required)
            3. Launch from Start Menu or Desktop shortcut
            
            ### macOS
            1. Download `rouen-macos-universal.dmg`
            2. Mount the DMG and drag Rouen.app to Applications
            3. Launch from Applications or Spotlight
            
            ### Linux
            1. Download `rouen-linux-x64.tar.gz`
            2. Extract: `tar -xzf rouen-linux-x64.tar.gz`
            3. Install dependencies: `sudo apt install libx11-6 libgl1-mesa-glx libasound2`
            4. Run: `./run-rouen.sh` or `./rouen`
            
            ## System Requirements
            - **Windows**: Windows 10 version 1903 or later (x64)
            - **macOS**: macOS 11.0 (Big Sur) or later, Apple Silicon or Intel
            - **Linux**: Ubuntu 20.04 LTS or equivalent, X11 display server
            
            All builds are self-contained and include all necessary dependencies.
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always() && (github.event_name == 'release' || needs.create-release.result == 'success')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Nix
      uses: cachix/install-nix-action@v31.10.6
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Cache Nix store
      uses: actions/cache@v6
      with:
        path: |
          /nix/store
          ~/.cache/nix
        key: ${{ runner.os }}-nix-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-keys: |
          ${{ runner.os }}-nix-

    - name: Build Release
      run: |
        echo "Building Rouen for Linux with Nix flake (proven approach)..."
        # Use the same proven approach as the working Linux Build & Test workflow
        nix build .#default --print-build-logs
        
        # Copy the result to expected location
        mkdir -p build-release
        if [ -L result ]; then
          if [ -f result/bin/rouen ]; then
            cp result/bin/rouen build-release/rouen
          elif [ -f result/rouen ]; then
            cp result/rouen build-release/rouen
          else
            find result -name "rouen" -type f -executable | head -1 | while read exe; do
              if [ -n "$exe" ]; then
                cp "$exe" build-release/rouen
              fi
            done
          fi
          chmod +x build-release/rouen
        fi

    - name: Run Tests
      run: |
        echo "Running tests with Nix..."
        nix develop --command bash -c "
          cmake -G Ninja -B build-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF && \
          cmake --build build-tests --parallel 2 && \
          cd build-tests/tests && ./test_ssl_modes_simple && ./test_fetch_ssl
        "

    - name: Package Linux Release
      run: |
        mkdir -p linux-release
        cp build-release/rouen linux-release/
        cp -f podcasts.txt presets.txt linux-release/ 2>/dev/null || true
        cp -rf external/fonts linux-release/ 2>/dev/null || true
        cp -f external/MaterialIcons-Regular.ttf linux-release/ 2>/dev/null || true
        cp -rf img linux-release/ 2>/dev/null || true
        
        cat > linux-release/run-rouen.sh << 'EOF'
        #!/bin/bash
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        cd "$SCRIPT_DIR"
        export LD_LIBRARY_PATH="$SCRIPT_DIR:$LD_LIBRARY_PATH"
        ./rouen "$@"
        EOF
        chmod +x linux-release/run-rouen.sh
        
        tar -czf rouen-linux-x64.tar.gz -C linux-release .

    - name: Upload Linux Asset
      run: |
        echo "Uploading Linux release asset..."
        gh release upload ${{ github.event.inputs.tag_name || github.ref_name }} rouen-linux-x64.tar.gz --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-15
    needs: [create-release]
    if: always() && (github.event_name == 'release' || needs.create-release.result == 'success')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Nix
      uses: cachix/install-nix-action@v31.10.6
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Configure and Build
      run: |
        nix develop --command bash -c "
          cmake -G Ninja -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF && \
          cmake --build build-release --parallel 2
        "

    - name: Create macOS Package
      run: |
        mkdir -p dist
        cp -R build-release/rouen.app dist/
        
        # Copy resources
        app_path="dist/rouen.app"
        resources_dir="$app_path/Contents/Resources"
        mkdir -p "$resources_dir"
        
        cp -f podcasts.txt presets.txt "$resources_dir/" 2>/dev/null || true
        cp -rf external/fonts "$resources_dir/" 2>/dev/null || true
        cp -f external/MaterialIcons-Regular.ttf "$resources_dir/" 2>/dev/null || true
        cp -rf img "$resources_dir/" 2>/dev/null || true
        
        # Create DMG
        temp_dmg_dir="dmg_temp"
        mkdir -p "$temp_dmg_dir"
        cp -R "$app_path" "$temp_dmg_dir/"
        ln -s /Applications "$temp_dmg_dir/Applications"
        hdiutil create -size 200m -fs HFS+ -volname "Rouen" -srcfolder "$temp_dmg_dir" "rouen-macos-universal.dmg"
        rm -rf "$temp_dmg_dir"

    - name: Upload macOS Asset
      run: |
        echo "Uploading macOS release asset..."
        gh release upload ${{ github.event.inputs.tag_name || github.ref_name }} rouen-macos-universal.dmg --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: [create-release]
    if: always() && (github.event_name == 'release' || needs.create-release.result == 'success')
    uses: ./.github/workflows/windows-release.yml
    with:
      tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
    secrets: inherit
