name: Windows Build & Test

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  release:
    types: [published]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.0)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup PowerShell
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
        Write-Host "PowerShell execution policy set to RemoteSigned"

    - name: Setup vcpkg cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ github.workspace }}/vcpkg-binary-cache
          ${{ github.workspace }}/vcpkg/installed
        key: ${{ runner.os }}-vcpkg-binary-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-binary-

    - name: Setup vcpkg
      shell: cmd
      run: |
        set "vcpkgDir=%GITHUB_WORKSPACE%\vcpkg"
        set "binCacheDir=%GITHUB_WORKSPACE%\vcpkg-binary-cache"
        if not exist "%binCacheDir%" mkdir "%binCacheDir%"
        
        set "VCPKG_ROOT=%vcpkgDir%"
        >>"%GITHUB_ENV%" echo VCPKG_ROOT=%vcpkgDir%
        if not exist "%vcpkgDir%\vcpkg.exe" (
          echo Cloning fresh vcpkg repository...
          if exist "%vcpkgDir%" rmdir /s /q "%vcpkgDir%"
          git clone https://github.com/Microsoft/vcpkg.git "%vcpkgDir%"
          if errorlevel 1 (
            echo ERROR: Failed to clone vcpkg
            exit /b 1
          )
        )
        cd /d "%vcpkgDir%"
        if not exist "vcpkg.exe" (
          echo Bootstrapping vcpkg...
          call bootstrap-vcpkg.bat -disableMetrics
          if errorlevel 1 (
            echo ERROR: Bootstrap failed with exit code %errorlevel%
            exit /b 1
          )
        )
        
        set "VCPKG_EXEC=%vcpkgDir%\vcpkg.exe"
        
        cd /d "%GITHUB_WORKSPACE%"
        
        echo Installing vcpkg packages (using binary cache if available)...
        "%VCPKG_EXEC%" install --triplet x64-windows --vcpkg-root="%VCPKG_ROOT%"
        if errorlevel 1 (
          echo ERROR: Package installation failed
          exit /b 1
        )
        
        
        echo Integrating vcpkg...
        "%VCPKG_EXEC%" integrate install --vcpkg-root="%VCPKG_ROOT%"
        
        echo Listing installed packages...
        "%VCPKG_EXEC%" list --vcpkg-root="%VCPKG_ROOT%"
        
        echo Verifying curl installation...
        "%VCPKG_EXEC%" list curl --vcpkg-root="%VCPKG_ROOT%"
        if not errorlevel 0 (
          echo WARNING: curl package may not be properly installed
        )
        
        echo Checking for DLL files...
        if exist "installed\x64-windows\bin" (
          echo DLL files in bin directory:
          dir "installed\x64-windows\bin\*.dll"
        ) else (
          echo WARNING: x64-windows\bin directory not found
        )
        
        if exist "installed\x64-windows\debug\bin" (
          echo DLL files in debug\bin directory:
          dir "installed\x64-windows\debug\bin\*.dll"
        )

    - name: Verify vcpkg installation
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $vcpkgDir = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { "$workspace\vcpkg" }
        $binPath = "$vcpkgDir\installed\x64-windows\bin"
        
        Write-Host "=== COMPREHENSIVE VCPKG VERIFICATION ==="
        Write-Host "vcpkg directory: $vcpkgDir"
        Write-Host "Binary path: $binPath"
        
        # List all installed packages
        Write-Host "`nInstalled packages:"
        if (Test-Path "$vcpkgDir\vcpkg.exe") {
          Set-Location $vcpkgDir
          & ".\vcpkg.exe" list
        } else {
          Write-Host "vcpkg.exe not found!"
        }
        
        # Check if bin directory exists and list contents
        if (Test-Path $binPath) {
          Write-Host "`n✅ vcpkg bin directory exists"
          $allFiles = Get-ChildItem $binPath | Sort-Object Name
          Write-Host "Contents of bin directory ($($allFiles.Count) files):"
          foreach ($file in $allFiles) {
            $sizeKB = [math]::Round($file.Length / 1KB, 1)
            Write-Host "  $($file.Name) ($sizeKB KB)"
          }
        } else {
          Write-Host "`n⚠️ vcpkg bin directory not found"
          
          # Check if installed directory exists at all
          $installedDir = "$vcpkgDir\installed"
          if (Test-Path $installedDir) {
            Write-Host "Installed directory exists, checking subdirectories:"
            Get-ChildItem $installedDir | ForEach-Object { 
              Write-Host "  - $($_.Name) $(if ($_.PSIsContainer) { "(directory)" } else { "(file)" })"
            }
            
            # Check x64-windows subdirectory specifically
            $x64WindowsDir = "$installedDir\x64-windows"
            if (Test-Path $x64WindowsDir) {
              Write-Host "x64-windows directory contents:"
              Get-ChildItem $x64WindowsDir | ForEach-Object { 
                Write-Host "    - $($_.Name) $(if ($_.PSIsContainer) { "(directory)" } else { "(file)" })"
              }
            }
          }
        }
        
        # Check for specific required DLLs
        $requiredDlls = @("libcurl.dll", "libcurld.dll", "libssl-3-x64.dll", "libcrypto-3-x64.dll")
        Write-Host "`n=== REQUIRED DLL CHECK ==="
        foreach ($dll in $requiredDlls) {
          $dllPath = "$binPath\$dll"
          if (Test-Path $dllPath) {
            $sizeKB = [math]::Round((Get-Item $dllPath).Length / 1KB, 1)
            Write-Host "✅ Found $dll ($sizeKB KB)"
          } else {
            Write-Host "⚠️ Missing $dll"
            
            # Search for it anywhere in the vcpkg installation
            $foundFiles = Get-ChildItem -Recurse "$vcpkgDir\installed" -Filter $dll -ErrorAction SilentlyContinue
            if ($foundFiles) {
              foreach ($found in $foundFiles) {
                $relativePath = $found.FullName.Replace("$vcpkgDir\", "")
                Write-Host "  Found at: $relativePath"
              }
            } else {
              Write-Host "  Not found anywhere in vcpkg installation"
            }
          }
        }

    - name: Locate Ninja and add to PATH
      shell: pwsh
      run: |
        $ninjaFile = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter "ninja.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($ninjaFile) {
          $ninjaDir = $ninjaFile.DirectoryName
          Write-Host "Found ninja at: $ninjaDir"
          $ninjaDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Force Workspace VCPKG_ROOT
      shell: cmd
      run: |
        echo VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg>>"%GITHUB_ENV%"
        set "VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg"

    - name: Configure CMake
      shell: cmd
      run: |
        set "workspace=${{ github.workspace }}"
        set "VCPKG_ROOT=%workspace%\vcpkg"
        cmake -B build -S . ^
          -DCMAKE_TOOLCHAIN_FILE="%workspace%\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
          -DVCPKG_TARGET_TRIPLET=x64-windows ^
          -DVCPKG_INSTALLED_DIR="%workspace%\vcpkg\installed" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -G Ninja
        
        echo.
        echo === CMAKE CONFIGURATION VERIFICATION ===
        echo VCPKG_TARGET_TRIPLET=x64-windows
        echo CMAKE_TOOLCHAIN_FILE=%workspace%\vcpkg\scripts\buildsystems\vcpkg.cmake

    - name: Build with CMake
      shell: cmd
      run: |
        cmake --build build --config Release --parallel 2
        if errorlevel 1 (
          echo ERROR: Build failed
          exit /b 1
        )

    - name: Check build output for DLLs
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $buildDir = "$workspace\build"
        
        Write-Host "=== CHECKING BUILD OUTPUT FOR DLLs ==="
        Write-Host "Build directory: $buildDir"
        
        # Search for all DLLs in build directory
        $buildDlls = Get-ChildItem -Recurse $buildDir -Filter "*.dll" -ErrorAction SilentlyContinue
        if ($buildDlls) {
          Write-Host "`nDLLs found in build directory ($($buildDlls.Count) total):"
          foreach ($dll in $buildDlls | Sort-Object FullName) {
            $relativePath = $dll.FullName.Replace("$buildDir\", "")
            $sizeKB = [math]::Round($dll.Length / 1KB, 1)
            Write-Host "  $relativePath ($sizeKB KB)"
            if ($dll.Name -like "*curl*") {
              Write-Host "    *** CURL DLL FOUND IN BUILD: $($dll.FullName) ***"
            }
          }
        } else {
          Write-Host "No DLLs found in build directory"
        }
        
        # Check Release subdirectory specifically
        $releaseDir = "$buildDir\Release"
        if (Test-Path $releaseDir) {
          Write-Host "`nRelease directory contents:"
          Get-ChildItem $releaseDir | ForEach-Object {
            $sizeKB = if ($_.PSIsContainer) { "<DIR>" } else { "$([math]::Round($_.Length / 1KB, 1)) KB" }
            Write-Host "  $($_.Name) ($sizeKB)"
          }
          
          # Check if CMake copied DLLs to the same directory as the executable
          $releaseDlls = Get-ChildItem "$releaseDir\*.dll" -ErrorAction SilentlyContinue
          if ($releaseDlls) {
            Write-Host "`n✅ CMake successfully copied DLLs to Release directory:"
            foreach ($dll in $releaseDlls) {
              $sizeKB = [math]::Round($dll.Length / 1KB, 1)
              Write-Host "  ✅ $($dll.Name) ($sizeKB KB)"
            }
          } else {
            Write-Host "`n⚠️ No DLLs found in Release directory - CMake DLL copying may have failed"
          }
        }
        
        # Check if CMake created the executable
        $exePaths = @(
          "$buildDir\Release\rouen.exe",
          "$buildDir\Debug\rouen.exe",
          "$buildDir\rouen.exe"
        )
        
        foreach ($exePath in $exePaths) {
          if (Test-Path $exePath) {
            Write-Host "`n✅ Found executable: $exePath"
            $exeDir = Split-Path $exePath -Parent
            Write-Host "Executable directory: $exeDir"
            
            # List all files in the executable directory
            $exeDirFiles = Get-ChildItem $exeDir -ErrorAction SilentlyContinue
            Write-Host "Files in executable directory ($($exeDirFiles.Count) total):"
            foreach ($file in $exeDirFiles) {
              $sizeKB = if ($file.PSIsContainer) { "<DIR>" } else { "$([math]::Round($file.Length / 1KB, 1)) KB" }
              $marker = if ($file.Name -like "*.dll") { "📦 DLL" } elseif ($file.Name -like "*.exe") { "🔧 EXE" } else { "📄" }
              Write-Host "  $marker $($file.Name) ($sizeKB)"
            }
            break
          }
        }

    - name: Package application
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $buildDir = "$workspace\build"
        
        New-Item -ItemType Directory -Force -Path $distDir
        Write-Host "Created distribution directory: $distDir"
        
        # Find and copy executable
        $exePaths = @(
          "$buildDir\Release\rouen.exe",
          "$buildDir\Debug\rouen.exe",
          "$buildDir\rouen.exe"
        )
        
        $exeFound = $false
        $exeDir = ""
        foreach ($exePath in $exePaths) {
          if (Test-Path $exePath) {
            Write-Host "✅ Found executable at: $exePath"
            Copy-Item $exePath $distDir
            $exeFound = $true
            $exeDir = Split-Path $exePath -Parent
            
            # PRIORITY: Copy DLLs from the same directory as the executable (CMake should have placed them here)
            $exeDlls = Get-ChildItem "$exeDir\*.dll" -ErrorAction SilentlyContinue
            if ($exeDlls) {
              Write-Host "`n🎯 PRIORITY: Copying DLLs from executable directory ($($exeDlls.Count) found):"
              foreach ($dll in $exeDlls) {
                $name = $dll.Name.ToLower()
                # Exclude debug, test, runtime, and system DLLs
                if ($name -like "*gtest*" -or $name -like "*gmock*" -or $name -like "pkgconf*" -or
                    $name -like "*-d.dll" -or $name -like "*d1.dll" -or $name -eq "libcurld.dll" -or
                    $name -like "msvcp140*" -or $name -like "vcruntime140*" -or $name -like "concrt140*" -or
                    $name -eq "advapi32.dll" -or $name -eq "crypt32.dll" -or $name -eq "ws2_32.dll") {
                  Write-Host "  ⏭️ Skipping unwanted DLL: $($dll.Name)"
                  continue
                }
                $destPath = "$distDir\$($dll.Name)"
                Copy-Item $dll.FullName $destPath -ErrorAction SilentlyContinue
                $sizeKB = [math]::Round($dll.Length / 1KB, 1)
                Write-Host "  ✅ Copied from exe-dir: $($dll.Name) ($sizeKB KB)"
                if ($dll.Name -like "*curl*") {
                  Write-Host "    🎉 *** LIBCURL FOUND AND COPIED FROM EXE DIRECTORY! ***"
                }
              }
            } else {
              Write-Host "⚠️ No DLLs found in executable directory - CMake post-build copying may have failed"
            }
            break
          }
        }
        
        if (-not $exeFound) {
          Write-Host "❌ ERROR: Could not find rouen.exe"
          Write-Host "Available executables in build directory:"
          Get-ChildItem -Recurse $buildDir -Include "*.exe" | ForEach-Object { Write-Host "Found exe: $($_.FullName)" }
          exit 1
        }
        
        # Summary of what we have so far
        $currentDlls = Get-ChildItem "$distDir\*.dll" -ErrorAction SilentlyContinue
        Write-Host "`n📊 DLLs copied from executable directory: $($currentDlls.Count)"
        if ($currentDlls.Count -gt 0) {
          foreach ($dll in $currentDlls) {
            Write-Host "  📦 $($dll.Name)"
          }
        }

    - name: Copy vcpkg DLLs (fallback)
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $vcpkgBinPath = "$workspace\vcpkg\installed\x64-windows\bin"
        
        # Check what DLLs we already have from CMake
        $existingDlls = Get-ChildItem "$distDir\*.dll" -ErrorAction SilentlyContinue
        Write-Host "=== VCPKG DLL FALLBACK COPY ==="
        Write-Host "DLLs already in dist from CMake: $($existingDlls.Count)"
        
        Write-Host "`nvcpkg release bin directory: $vcpkgBinPath (exists: $(Test-Path $vcpkgBinPath))"
        
        # Copy release DLLs from vcpkg installed bin (skipping test, debug, tool, CRT, and system DLLs)
        if (Test-Path $vcpkgBinPath) {
          $vcpkgDlls = Get-ChildItem "$vcpkgBinPath\*.dll" -ErrorAction SilentlyContinue
          Write-Host "`nvcpkg release DLLs available: $($vcpkgDlls.Count)"
          
          $copiedCount = 0
          foreach ($dll in $vcpkgDlls) {
            $name = $dll.Name.ToLower()
            if ($name -like "*gtest*" -or $name -like "*gmock*" -or $name -like "pkgconf*" -or
                $name -like "*-d.dll" -or $name -like "*d1.dll" -or $name -eq "libcurld.dll" -or
                $name -like "msvcp140*" -or $name -like "vcruntime140*" -or $name -like "concrt140*" -or
                $name -eq "advapi32.dll" -or $name -eq "crypt32.dll" -or $name -eq "ws2_32.dll") {
              continue
            }
            
            $destPath = "$distDir\$($dll.Name)"
            if (-not (Test-Path $destPath)) {
              Copy-Item $dll.FullName $destPath -ErrorAction SilentlyContinue
              Write-Host "  ✅ Fallback copied: $($dll.Name)"
              $copiedCount++
              if ($dll.Name -like "*curl*") {
                Write-Host "    🎉 *** LIBCURL COPIED VIA VCPKG FALLBACK! ***"
              }
            } else {
              Write-Host "  ⏭️ Skipped (already exists): $($dll.Name)"
            }
          }
          Write-Host "Fallback copied from vcpkg release: $copiedCount DLLs"
        } else {
          Write-Host "⚠️ vcpkg release bin directory not found"
        }
        
        # Verify release libcurl
        $finalCurlCheck = Get-ChildItem "$distDir\libcurl.dll" -ErrorAction SilentlyContinue
        if ($finalCurlCheck) {
          $sizeKB = [math]::Round($finalCurlCheck.Length / 1KB, 1)
          Write-Host "`n✅ Release libcurl.dll present in distribution ($sizeKB KB)"
        } else {
          Write-Host "`n⚠️ libcurl.dll not found in dist, checking vcpkg installed tree..."
          $foundCurl = Get-ChildItem -Path "$workspace\vcpkg\installed\x64-windows\bin" -Filter "libcurl.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($foundCurl) {
            Copy-Item $foundCurl.FullName "$distDir\libcurl.dll" -ErrorAction SilentlyContinue
            Write-Host "  ✅ Copied libcurl.dll from $($foundCurl.FullName)"
          } else {
            Write-Host "❌ libcurl.dll not found!"
          }
        }

    - name: Sanitize and filter release distribution
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        
        Write-Host "=== Sanitizing Release Distribution ==="
        
        # 1. Purge Visual C++ runtime DLLs (never bundle app-local CRT to avoid version mismatch / std::mutex crashes)
        $vcRuntimePatterns = @(
          "msvcp140*.dll",
          "vcruntime140*.dll",
          "concrt140*.dll",
          "vccorlib140*.dll",
          "msvcr*.dll",
          "ucrtbase*.dll"
        )
        
        # 2. Purge Windows OS system DLLs (must never be shipped with desktop apps)
        $systemDllPatterns = @(
          "advapi32.dll",
          "crypt32.dll",
          "ws2_32.dll",
          "kernel32.dll",
          "user32.dll",
          "gdi32.dll",
          "shell32.dll",
          "ole32.dll",
          "oleaut32.dll",
          "comctl32.dll",
          "comdlg32.dll",
          "shlwapi.dll",
          "version.dll",
          "winmm.dll",
          "imm32.dll",
          "ntdll.dll"
        )
        
        # 3. Purge debug, test, and build tool artifacts
        $debugAndTestPatterns = @(
          "*gtest*.dll",
          "*gmock*.dll",
          "pkgconf*.dll",
          "*-d.dll",
          "*d1.dll",
          "libcurld.dll",
          "*.pdb",
          "*.ilk",
          "*.exp",
          "*.lib"
        )
        
        $allRemovePatterns = $vcRuntimePatterns + $systemDllPatterns + $debugAndTestPatterns
        $removedCount = 0
        foreach ($pattern in $allRemovePatterns) {
          $matches = Get-ChildItem -Path $distDir -Filter $pattern -ErrorAction SilentlyContinue
          foreach ($file in $matches) {
            Remove-Item $file.FullName -Force -ErrorAction SilentlyContinue
            Write-Host "  🗑️ Purged unwanted binary: $($file.Name)"
            $removedCount++
          }
        }
        
        # 4. Remove duplicate unversioned FFmpeg DLLs (keep avcodec-61.dll, remove unversioned avcodec.dll)
        $ffmpegBases = @("avcodec", "avformat", "avutil", "swscale", "swresample", "postproc")
        foreach ($base in $ffmpegBases) {
          $versioned = Get-ChildItem -Path $distDir -Filter "$base-[0-9]*.dll" -ErrorAction SilentlyContinue
          $unversioned = Join-Path $distDir "$base.dll"
          if ($versioned -and (Test-Path $unversioned)) {
            Remove-Item $unversioned -Force -ErrorAction SilentlyContinue
            Write-Host "  🗑️ Purged duplicate unversioned FFmpeg DLL: $base.dll (keeping $($versioned.Name))"
            $removedCount++
          }
        }
        
        Write-Host "Sanitization complete: $removedCount items cleaned up."

    - name: Copy additional assets
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        
        # Copy directories if they exist
        $assetPaths = @{
          "$workspace\img" = "img directory"
          "$workspace\external\fonts" = "fonts directory"
        }
        
        foreach ($path in $assetPaths.Keys) {
          if (Test-Path $path) {
            Copy-Item -Recurse $path $distDir
            Write-Host "Copied $($assetPaths[$path])"
          }
        }
        
        # Copy individual files if they exist
        $files = @(
          "$workspace\resources\cacert.pem",
          "$workspace\external\MaterialIcons-Regular.ttf",
          "$workspace\external\IconsMaterialDesign.h",
          "$workspace\presets.txt",
          "$workspace\podcasts.txt",
          "$workspace\README.md",
          "$workspace\LICENSE",
          "$workspace\scripts\upgrade-rouen.ps1",
          "$workspace\scripts\upgrade-windows-msi.ps1"
        )
        
        foreach ($file in $files) {
          if (Test-Path $file) {
            Copy-Item $file $distDir
            Write-Host "Copied: $(Split-Path -Leaf $file)"
          }
        }

    - name: Verify DLL dependencies
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $exePath = "$distDir\rouen.exe"
        
        if (-not (Test-Path $exePath)) {
          Write-Host "❌ Executable not found for dependency check: $exePath"
          exit 1
        }
        
        Write-Host "=== DLL Dependency Analysis ==="
        Write-Host "Executable: $exePath"
        
        # Use dumpbin if available (part of MSVC build tools)
        $dumpbin = Get-Command "dumpbin.exe" -ErrorAction SilentlyContinue
        if ($dumpbin) {
          Write-Host "`nUsing dumpbin to analyze dependencies:"
          try {
            $dependencies = & $dumpbin /dependents $exePath 2>&1 | Select-String "\.dll" | ForEach-Object { $_.ToString().Trim() }
            foreach ($dep in $dependencies) {
              if ($dep -like "*.dll") {
                $dllName = ($dep -split '\s+')[-1]
                $localPath = "$distDir\$dllName"
                if (Test-Path $localPath) {
                  Write-Host "  ✅ $dllName (included)"
                } else {
                  Write-Host "  ⚠️  $dllName (system/external)"
                }
              }
            }
          } catch {
            Write-Host "  Could not run dumpbin analysis: $($_.Exception.Message)"
          }
        } else {
          Write-Host "dumpbin not available, skipping detailed dependency analysis"
        }
        
        # Assert NO forbidden DLLs are present in distDir
        $forbiddenPatterns = @(
          "msvcp140*.dll",
          "vcruntime140*.dll",
          "concrt140*.dll",
          "crypt32.dll",
          "ws2_32.dll",
          "advapi32.dll",
          "*gtest*.dll",
          "*gmock*.dll",
          "pkgconf*.dll",
          "*-d.dll",
          "*d1.dll",
          "libcurld.dll"
        )
        $violations = @()
        foreach ($pattern in $forbiddenPatterns) {
          $found = Get-ChildItem -Path $distDir -Filter $pattern -ErrorAction SilentlyContinue
          if ($found) {
            foreach ($f in $found) {
              $violations += $f.Name
            }
          }
        }
        if ($violations.Count -gt 0) {
          Write-Error "❌ FAILED: Forbidden DLLs found in distribution: $($violations -join ', ')"
          exit 1
        }
        Write-Host "✅ Verified no forbidden/system/debug DLLs exist in dist."
        
        # List all DLLs we've collected
        $collectedDlls = Get-ChildItem "$distDir\*.dll" -ErrorAction SilentlyContinue
        Write-Host "`n=== Final Release DLLs ($($collectedDlls.Count) total) ==="
        foreach ($dll in $collectedDlls | Sort-Object Name) {
          $sizeKB = [math]::Round($dll.Length / 1KB, 1)
          Write-Host "  📦 $($dll.Name) ($sizeKB KB)"
        }
        
        if ($collectedDlls.Count -eq 0) {
          Write-Error "❌ ERROR: No DLLs found in distribution directory!"
          exit 1
        }

    - name: Create dependency manifest
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $manifestPath = "$distDir\DEPENDENCIES.txt"
        
        $dllFiles = Get-ChildItem "$distDir\*.dll" -ErrorAction SilentlyContinue
        $totalDlls = $dllFiles.Count
        $totalSize = ($dllFiles | Measure-Object Length -Sum).Sum
        
        # Categorize DLLs
        $vcpkgDlls = @()
        $otherDlls = @()
        
        foreach ($dll in $dllFiles) {
          $name = $dll.Name.ToLower()
          if ($name -like "*ssl*" -or $name -like "*curl*" -or $name -like "*sdl*" -or $name -like "*tiny*" -or $name -like "*zlib*" -or $name -like "*av*" -or $name -like "*sw*" -or $name -like "*sqlite*") {
            $vcpkgDlls += $dll
          } else {
            $otherDlls += $dll
          }
        }
        
        # Create manifest content using array and join
        $manifestLines = @()
        $manifestLines += "Rouen Windows x64 Distribution"
        $manifestLines += "=============================="
        $manifestLines += ""
        $manifestLines += "This package contains the Rouen application with all required third-party DLL dependencies."
        $manifestLines += ""
        $manifestLines += "SUMMARY:"
        $manifestLines += "  Total DLLs included: $totalDlls"
        $manifestLines += "  Total DLL size: $([math]::Round($totalSize / 1MB, 2)) MB"
        $manifestLines += "  Third-party / vcpkg libraries: $($vcpkgDlls.Count)"
        $manifestLines += "  Other libraries: $($otherDlls.Count)"
        $manifestLines += ""
        
        if ($vcpkgDlls.Count -gt 0) {
          $manifestLines += "BUNDLED LIBRARIES:"
          $vcpkgDlls | Sort-Object Name | ForEach-Object { 
            $manifestLines += "  - $($_.Name) ($([math]::Round($_.Length / 1KB, 1)) KB)"
          }
          $manifestLines += ""
        }
        
        if ($otherDlls.Count -gt 0) {
          $manifestLines += "OTHER LIBRARIES:"
          $otherDlls | Sort-Object Name | ForEach-Object { 
            $manifestLines += "  - $($_.Name) ($([math]::Round($_.Length / 1KB, 1)) KB)"
          }
          $manifestLines += ""
        }
        
        $manifestLines += "RUNTIME REQUIREMENTS:"
        $manifestLines += "  - Windows 10 or later (x64)"
        $manifestLines += "  - Microsoft Visual C++ 2015-2022 Redistributable (x64)"
        $manifestLines += "    Download: https://aka.ms/vs/17/release/vc_redist.x64.exe"
        $manifestLines += "    (VC++ runtime DLLs are not bundled to prevent toolset ABI mismatch and ensure OS security patches)"
        $manifestLines += ""
        
        $manifestLines += "TROUBLESHOOTING:"
        if ($vcpkgDlls.Count -eq 0) {
          $manifestLines += "  ⚠️  WARNING: No vcpkg DLLs found! libcurl.dll and SSL libraries may be missing."
          $manifestLines += "  🔧 This indicates CMake DLL copying failed. Check build logs for errors."
        } else {
          $manifestLines += "  ✅ Bundled dependencies appear to be included."
        }
        
        $curlFound = $dllFiles | Where-Object { $_.Name -like "*curl*" }
        if ($curlFound) {
          $manifestLines += "  ✅ CURL library found: $($curlFound.Name -join ', ')"
          $manifestLines += "  🌐 Network functionality should work correctly."
        } else {
          $manifestLines += "  ❌ CURL library NOT found - network functionality may not work!"
          $manifestLines += "  🔧 SOLUTION: Ensure vcpkg installed curl[ssl] and CMake copied DLLs correctly."
          $manifestLines += "  🔧 Alternative: Download libcurl.dll manually and place it with the executable."
        }
        
        $sslFound = $dllFiles | Where-Object { $_.Name -like "*ssl*" -or $_.Name -like "*crypto*" }
        if ($sslFound) {
          $manifestLines += "  ✅ SSL/Crypto libraries found: $($sslFound.Name -join ', ')"
          $manifestLines += "  🔒 Secure connections should work correctly."
        } else {
          $manifestLines += "  ❌ SSL/Crypto libraries NOT found - secure connections may not work!"
          $manifestLines += "  🔧 SOLUTION: Ensure OpenSSL DLLs are properly installed and copied."
        }
        
        $manifestLines += ""
        $manifestLines += "If you encounter missing DLL or runtime errors:"
        $manifestLines += "  1. Install or update Microsoft Visual C++ 2015-2022 Redistributable (x64): https://aka.ms/vs/17/release/vc_redist.x64.exe"
        $manifestLines += "  2. Run the application from the same directory as this manifest"
        $manifestLines += "  3. Check Windows Update for the latest system updates"
        $manifestLines += ""
        $manifestLines += "Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
        $manifestLines += "Build: GitHub Actions"
        $manifestLines += "Workflow: Windows Release Build"
        
        $manifest = $manifestLines -join "`r`n"
        $manifest | Out-File -FilePath $manifestPath -Encoding UTF8
        Write-Host "Created comprehensive dependency manifest with $totalDlls DLLs"
        
        # List all files in distribution
        Write-Host "`nFinal distribution contents:"
        Get-ChildItem -Recurse $distDir | Sort-Object FullName | ForEach-Object { 
          $relativePath = $_.FullName.Replace("$distDir\", "")
          $size = if ($_.PSIsContainer) { "<DIR>" } else { "$([math]::Round($_.Length / 1KB, 1)) KB" }
          Write-Host "  $relativePath ($size)"
        }

    - name: Create ZIP archive
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $zipPath = "$workspace\rouen-windows-x64.zip"
        
        Set-Location $distDir
        Compress-Archive -Path * -DestinationPath $zipPath -Force
        
        $zipInfo = Get-Item $zipPath
        Write-Host "Created ZIP archive: $zipPath"
        Write-Host "        Archive size: $([math]::Round($zipInfo.Length / 1MB, 2)) MB"

    - name: Install WiX Toolset
      shell: pwsh
      run: |
        Write-Host "=== Installing WiX Toolset ==="
        
        # Use GitHub Actions marketplace action for WiX installation (most reliable)
        Write-Host "Attempting GitHub action-based installation..."
        
        try {
          # Download and extract WiX directly from GitHub releases
          $wixVersion = "v3.11.2"
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip"
          $wixZip = "$env:TEMP\wix311-binaries.zip"
          $wixExtractPath = "$env:TEMP\WiX"
          
          Write-Host "Downloading WiX binaries from: $wixUrl"
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixZip -UseBasicParsing
          
          if (-not (Test-Path $wixZip)) {
            throw "Failed to download WiX binaries"
          }
          
          Write-Host "Downloaded WiX archive: $((Get-Item $wixZip).Length) bytes"
          
          Write-Host "Extracting WiX binaries to: $wixExtractPath"
          Expand-Archive -Path $wixZip -DestinationPath $wixExtractPath -Force
          
          # Find candle.exe in extracted files
          $candleExe = Get-ChildItem -Recurse $wixExtractPath -Name "candle.exe" | Select-Object -First 1
          if ($candleExe) {
            $wixBinPath = Split-Path (Get-ChildItem -Recurse $wixExtractPath -Filter "candle.exe" | Select-Object -First 1).FullName
            Write-Host "✅ WiX tools found at: $wixBinPath"
            
            # Add to PATH
            $env:PATH = "$wixBinPath;$env:PATH"
            Write-Host "WiX tools added to PATH"
            
            # Test tools
            & "$wixBinPath\candle.exe" -? | Select-Object -First 3
            & "$wixBinPath\light.exe" -? | Select-Object -First 3
            
            # Set environment variable for later steps
            echo "WIX_PATH=$wixBinPath" >> $env:GITHUB_ENV
            
          } else {
            throw "candle.exe not found in extracted WiX files"
          }
          
        } catch {
          Write-Host "Direct download failed, trying installer method..."
          
          # Fallback to installer with better error handling
          $wixInstallerUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe"
          $wixInstaller = "$env:TEMP\wix311.exe"
          
          Write-Host "Downloading WiX installer from: $wixInstallerUrl"
          
          try {
            Invoke-WebRequest -Uri $wixInstallerUrl -OutFile $wixInstaller -UseBasicParsing -TimeoutSec 60
          } catch {
            Write-Error "Failed to download WiX installer: $($_.Exception.Message)"
            exit 1
          }
          
          if (-not (Test-Path $wixInstaller)) {
            Write-Error "WiX installer download failed"
            exit 1
          }
          
          $installerSize = (Get-Item $wixInstaller).Length
          Write-Host "Downloaded installer: $installerSize bytes"
          
          if ($installerSize -lt 10000) {
            Write-Error "Downloaded file appears to be too small (possibly error page)"
            exit 1
          }
          
          Write-Host "Installing WiX Toolset silently..."
          $installArgs = @("/quiet", "/norestart")
          $installProcess = Start-Process -FilePath $wixInstaller -ArgumentList $installArgs -Wait -PassThru -NoNewWindow
          
          Write-Host "Install process exit code: $($installProcess.ExitCode)"
          
          if ($installProcess.ExitCode -eq 0) {
            # Verify installation in standard locations
            $standardPaths = @(
              "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin",
              "${env:ProgramFiles}\WiX Toolset v3.11\bin"
            )
            
            $wixPath = $null
            foreach ($path in $standardPaths) {
              if (Test-Path "$path\candle.exe") {
                $wixPath = $path
                break
              }
            }
            
            if ($wixPath) {
              Write-Host "✅ WiX Toolset installed at: $wixPath"
              $env:PATH = "$wixPath;$env:PATH"
              echo "WIX_PATH=$wixPath" >> $env:GITHUB_ENV
              Write-Host "WiX tools added to PATH"
            } else {
              Write-Error "WiX installation completed but tools not found"
              exit 1
            }
          } else {
            Write-Error "WiX installer failed with exit code: $($installProcess.ExitCode)"
            exit 1
          }
        }

    - name: Create MSI Installer
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $installerDir = "$workspace\installer"
        
        # Calculate clean semver version from tag / inputs
        $rawTag = "${{ inputs.tag_name }}"
        if (-not $rawTag) { $rawTag = "${{ github.ref_name }}" }
        $cleanSemVer = $rawTag -replace '^v', ''
        if ($cleanSemVer -notmatch '^\d+\.\d+\.\d+') {
          $cleanSemVer = "1.4.12"
        }
        $version = "$cleanSemVer.0"
        
        Write-Host "=== Creating MSI Installer ==="
        Write-Host "Workspace: $workspace"
        Write-Host "Distribution: $distDir" 
        Write-Host "Installer config: $installerDir"
        Write-Host "Version: $version (SemVer: $cleanSemVer)"
        
        # Ensure installer directory exists
        if (-not (Test-Path $installerDir)) {
          Write-Error "Installer directory not found: $installerDir"
          Write-Host "Available directories:"
          Get-ChildItem $workspace -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
          exit 1
        }
        
        # Check for WiX source file
        $wxsFile = "$installerDir\rouen.wxs"
        if (-not (Test-Path $wxsFile)) {
          Write-Error "WiX source file not found: $wxsFile"
          Write-Host "Files in installer directory:"
          Get-ChildItem $installerDir | ForEach-Object { Write-Host "  - $($_.Name)" }
          exit 1
        }
        
        # Check for icon file
        $iconFile = "$workspace\resources\rouen.ico"
        if (-not (Test-Path $iconFile)) {
          Write-Warning "Icon file not found: $iconFile"
          # Try alternative locations
          $alternativeIcons = @(
            "$workspace\img\rouen.ico",
            "$workspace\resources\Rouen.ico",
            "$workspace\img\Rouen.ico"
          )
          foreach ($altIcon in $alternativeIcons) {
            if (Test-Path $altIcon) {
              $iconFile = $altIcon
              Write-Host "✅ Found alternative icon: $iconFile"
              break
            }
          }
        } else {
          Write-Host "✅ Found icon file: $iconFile"
        }
        
        # Find WiX tools
        $wixPath = $env:WIX_PATH
        if (-not $wixPath) {
          # Fallback to standard paths if environment variable not set
          $possibleWixPaths = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin",
            "${env:ProgramFiles}\WiX Toolset v3.11\bin",
            "${env:LOCALAPPDATA}\WiX Toolset v3.11\bin"
          )
          
          foreach ($path in $possibleWixPaths) {
            if (Test-Path "$path\candle.exe") {
              $wixPath = $path
              break
            }
          }
        }
        
        if (-not $wixPath -or -not (Test-Path "$wixPath\candle.exe")) {
          Write-Error "WiX tools not found. WIX_PATH: $wixPath"
          if ($wixPath) {
            Write-Host "Checking WiX path contents:"
            if (Test-Path $wixPath) {
              Get-ChildItem $wixPath | ForEach-Object { Write-Host "  - $($_.Name)" }
            } else {
              Write-Host "  Path does not exist: $wixPath"
            }
          }
          exit 1
        }
        
        $candleExe = "$wixPath\candle.exe"
        $lightExe = "$wixPath\light.exe"
        
        Write-Host "✅ Found WiX tools at: $wixPath"
        
        # Verify distribution directory and contents
        if (-not (Test-Path $distDir)) {
          Write-Error "Distribution directory not found: $distDir"
          exit 1
        }
        
        Write-Host "Distribution directory contents:"
        Get-ChildItem $distDir | ForEach-Object { 
          $sizeKB = if ($_.PSIsContainer) { "(dir)" } else { "$([math]::Round($_.Length / 1KB, 1)) KB" }
          Write-Host "  - $($_.Name) $sizeKB"
        }
        
        # Set up output paths
        $wixobjFile = "$workspace\rouen.wixobj"
        $msiFile = "$workspace\rouen-windows-x64.msi"
        $versionedMsiFile = "$workspace\rouen-v$cleanSemVer-windows-x64.msi"
        
        # Clean up any existing intermediate files
        if (Test-Path $wixobjFile) {
          Remove-Item $wixobjFile -Force
        }
        if (Test-Path $msiFile) {
          Remove-Item $msiFile -Force
        }
        if (Test-Path $versionedMsiFile) {
          Remove-Item $versionedMsiFile -Force
        }
        
        # Dynamically inject any missing DLLs, fonts (.ttf, .otf), and scripts (.ps1) from distDir into rouen.wxs Component Id="Dependencies"
        $wxsRaw = Get-Content $wxsFile -Raw
        $distAssets = Get-ChildItem "$distDir\*" -Include "*.dll","*.ttf","*.otf","*.ps1" -ErrorAction SilentlyContinue
        $injectedCount = 0
        $injectedXml = ""
        foreach ($asset in $distAssets) {
          $assetName = $asset.Name
          $nameLower = $assetName.ToLower()
          if ($nameLower -like "*gtest*" -or $nameLower -like "*gmock*" -or $nameLower -like "pkgconf*" -or
              $nameLower -like "*-d.dll" -or $nameLower -like "*d1.dll" -or
              $nameLower -like "msvcp140*" -or $nameLower -like "vcruntime140*" -or $nameLower -like "concrt140*" -or
              $nameLower -eq "advapi32.dll" -or $nameLower -eq "crypt32.dll" -or $nameLower -eq "ws2_32.dll") {
            continue
          }
          if ($wxsRaw -notlike "*$assetName*") {
            $fileId = "DynFile_" + ($assetName -replace '[^a-zA-Z0-9_]', '_')
            $injectedXml += "`r`n        <File Id=`"$fileId`" Source=`"`$(var.SourceDir)\$assetName`" />"
            $injectedCount++
            Write-Host "  ➕ Dynamically adding asset to MSI manifest: $assetName"
          }
        }
        if ($injectedCount -gt 0) {
          $tag = '</Component>'
          $idx = $wxsRaw.IndexOf($tag)
          if ($idx -ge 0) {
            $wxsRaw = $wxsRaw.Substring(0, $idx) + $injectedXml + "`r`n      " + $wxsRaw.Substring($idx)
          }
          Set-Content -Path $wxsFile -Value $wxsRaw -Encoding UTF8
          Write-Host "✅ Injected $injectedCount missing assets into rouen.wxs"
        }

        # Compile WiX source
        Write-Host "`n=== Compiling WiX Source ==="
        $candleArgs = @(
          "-out", $wixobjFile,
          "-dSourceDir=$distDir",
          "-dVersion=$version",
          $wxsFile
        )
        
        Write-Host "Running: candle.exe $($candleArgs -join ' ')"
        
        try {
          $candleOutput = & $candleExe @candleArgs 2>&1
          $candleExitCode = $LASTEXITCODE
          
          Write-Host "Candle output:"
          $candleOutput | ForEach-Object { Write-Host "  $_" }
          
          if ($candleExitCode -ne 0) {
            Write-Error "WiX compilation failed with exit code: $candleExitCode"
            exit 1
          }
          
          if (-not (Test-Path $wixobjFile)) {
            Write-Error "WiX object file was not created: $wixobjFile"
            exit 1
          }
          
          Write-Host "✅ WiX source compiled successfully"
          
        } catch {
          Write-Error "Exception during WiX compilation: $($_.Exception.Message)"
          exit 1
        }
        
        # Link to create MSI
        Write-Host "`n=== Creating MSI Package ==="
        $lightArgs = @(
          "-out", $msiFile,
          "-ext", "WixUIExtension",
          "-spdb",  # Suppress PDB creation
          $wixobjFile
        )
        
        Write-Host "Running: light.exe $($lightArgs -join ' ')"
        
        try {
          $lightOutput = & $lightExe @lightArgs 2>&1
          $lightExitCode = $LASTEXITCODE
          
          Write-Host "Light output:"
          $lightOutput | ForEach-Object { Write-Host "  $_" }
          
          if ($lightExitCode -ne 0) {
            Write-Error "MSI creation failed with exit code: $lightExitCode"
            exit 1
          }
          
        } catch {
          Write-Error "Exception during MSI creation: $($_.Exception.Message)"
          exit 1
        }
        
        # Verify MSI was created
        if (Test-Path $msiFile) {
          Copy-Item $msiFile $versionedMsiFile -Force
          $msiInfo = Get-Item $msiFile
          $sizeMB = [math]::Round($msiInfo.Length / 1MB, 2)
          
          Write-Host "`n✅ MSI Package Created Successfully!"
          Write-Host "Primary MSI: $($msiInfo.Name)"
          Write-Host "Versioned MSI: $(Split-Path -Leaf $versionedMsiFile)"
          Write-Host "Size: $sizeMB MB"
          Write-Host "Path: $($msiInfo.FullName)"
          Write-Host "Created: $($msiInfo.CreationTime)"
          
          # Set output for later steps
          echo "MSI_FILE=$msiFile" >> $env:GITHUB_ENV
          echo "MSI_NAME=rouen-windows-x64.msi" >> $env:GITHUB_ENV
          
        } else {
          Write-Error "MSI file was not created: $msiFile"
          Write-Host "Files in workspace directory:"
          Get-ChildItem $workspace -Filter "*.msi" | ForEach-Object { Write-Host "  - $($_.Name)" }
          exit 1
        }
        
        # Clean up intermediate files
        if (Test-Path $wixobjFile) {
          Remove-Item $wixobjFile -Force
          Write-Host "Cleaned up intermediate files"
        }

    - name: Run Windows smoke test
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $exe = "$distDir\rouen.exe"
        $zipPath = "$workspace\rouen-windows-x64.zip"
        $msiFile = "$workspace\rouen-windows-x64.msi"
        
        Write-Host "=== Running Windows Smoke Tests ==="
        
        # Test 1: Verify rouen.exe --help runs directly from dist directory
        Write-Host "`n--- Test 1: CLI help from dist directory ---"
        if (-not (Test-Path $exe)) {
          Write-Error "rouen.exe not found at $exe"
          exit 1
        }
        $helpOutput = & $exe --help 2>&1
        $helpExit = $LASTEXITCODE
        Write-Host ($helpOutput -join "`n")
        if ($helpExit -ne 0) {
          Write-Error "rouen.exe --help failed with exit code $helpExit"
          exit 1
        }
        Write-Host "✅ CLI help test passed"
        
        # Test 2: Verify rouen.exe launches in background and stays alive without crashing
        Write-Host "`n--- Test 2: Process startup and stability test ---"
        $proc = Start-Process -FilePath $exe -ArgumentList "--daemon" -PassThru -NoNewWindow
        Start-Sleep -Seconds 5
        if ($proc.HasExited) {
          Write-Error "rouen.exe crashed or exited prematurely! Exit code: $($proc.ExitCode)"
          exit 1
        }
        Write-Host "✅ rouen.exe process is running stably after 5 seconds (PID: $($proc.Id))"
        Stop-Process -Id $proc.Id -Force
        
        # Test 3: Test extracted ZIP package in a clean isolated directory
        Write-Host "`n--- Test 3: Portable ZIP clean extract test ---"
        $tempExtract = Join-Path $env:TEMP "rouen_smoke_zip_$([Guid]::NewGuid().ToString().Substring(0,8))"
        Expand-Archive -Path $zipPath -DestinationPath $tempExtract -Force
        $zipExe = Join-Path $tempExtract "rouen.exe"
        if (-not (Test-Path $zipExe)) {
          Write-Error "rouen.exe not found in extracted ZIP at $zipExe"
          exit 1
        }
        
        # Verify no forbidden DLLs inside ZIP
        $forbiddenNames = @("msvcp140.dll", "vcruntime140.dll", "crypt32.dll", "ws2_32.dll", "advapi32.dll", "libcurl-d.dll")
        foreach ($bad in $forbiddenNames) {
          if (Test-Path (Join-Path $tempExtract $bad)) {
            Write-Error "Forbidden DLL '$bad' was found inside the release ZIP!"
            exit 1
          }
        }
        Write-Host "✅ ZIP package is clean of forbidden/system/debug DLLs"
        
        $zipHelpOutput = & $zipExe --help 2>&1
        $zipHelpExit = $LASTEXITCODE
        if ($zipHelpExit -ne 0) {
          Write-Error "Extracted ZIP rouen.exe --help failed with exit code $zipHelpExit"
          exit 1
        }
        Write-Host "✅ Extracted ZIP rouen.exe executed cleanly"
        Remove-Item -Recurse -Force $tempExtract -ErrorAction SilentlyContinue
        
        # Test 4: MSI silent install and uninstall smoke test
        if (Test-Path $msiFile) {
          Write-Host "`n--- Test 4: MSI Installation & Execution Test ---"
          $msiLog = Join-Path $env:TEMP "msi_smoke_install.log"
          $installProcess = Start-Process msiexec.exe -ArgumentList "/i `"$msiFile`" /qn /norestart /l*v `"$msiLog`"" -Wait -PassThru
          Write-Host "MSI install exit code: $($installProcess.ExitCode)"
          if ($installProcess.ExitCode -ne 0) {
            Write-Host "MSI Log contents:"
            Get-Content $msiLog -Tail 50 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
            Write-Error "MSI installation failed with exit code $($installProcess.ExitCode)"
            exit 1
          }
          
          # Check installed executable
          $installedExe = Join-Path $env:LOCALAPPDATA "Rouen\Rouen\rouen.exe"
          if (Test-Path $installedExe) {
            Write-Host "✅ MSI installed rouen.exe at $installedExe"
            $installedHelp = & $installedExe --help 2>&1
            $installedHelpExit = $LASTEXITCODE
            if ($installedHelpExit -ne 0) {
              Write-Error "Installed rouen.exe --help failed with exit code $installedHelpExit"
              exit 1
            }
            Write-Host "✅ Installed rouen.exe runs cleanly"
          } else {
            Write-Host "⚠️ Warning: Installed executable not at default perUser path $installedExe"
          }
          
          # Clean uninstall
          Write-Host "Uninstalling test MSI..."
          $uninstallProcess = Start-Process msiexec.exe -ArgumentList "/x `"$msiFile`" /qn /norestart" -Wait -PassThru
          Write-Host "MSI uninstall exit code: $($uninstallProcess.ExitCode)"
          Write-Host "✅ MSI install/uninstall test passed"
        }
        
        Write-Host "`n🎉 All Windows smoke tests passed successfully!"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: rouen-windows-x64-complete
        path: |
          rouen-windows-x64.zip
          *.msi

    - name: Upload Windows Release Assets
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (inputs.tag_name != null && inputs.tag_name != '')
      shell: pwsh
      run: |
        $tag = "${{ inputs.tag_name }}"
        if (-not $tag) { $tag = "${{ github.event.release.tag_name }}" }
        if (-not $tag) { $tag = "${{ github.ref_name }}" }
        Write-Host "Uploading Windows release assets for tag: $tag"
        if (Test-Path "rouen-windows-x64.zip") {
          gh release upload $tag rouen-windows-x64.zip --clobber
        }
        $msiFiles = Get-ChildItem -Filter "*.msi" -ErrorAction SilentlyContinue
        foreach ($msi in $msiFiles) {
          Write-Host "Uploading MSI asset: $($msi.Name)"
          gh release upload $tag $msi.FullName --clobber
        }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
