name: Windows Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release'
        required: false
        default: false
        type: boolean

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Debug environment
      run: |
        Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Workspace: ${{ github.workspace }}"
        Write-Host "Environment variables:"
        Get-ChildItem Env: | Where-Object { $_.Name -like "*GITHUB*" -or $_.Name -like "*RUNNER*" } | Format-Table Name, Value
        Write-Host "Directory listing:"
        Get-ChildItem ${{ github.workspace }} | Format-Table Name, Mode
      shell: pwsh

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup vcpkg
      run: |
        $workspace = "${{ github.workspace }}"
        $vcpkgPath = "$workspace\vcpkg"
        
        Write-Host "Workspace: $workspace"
        Write-Host "vcpkg path: $vcpkgPath"
        
        # Clone vcpkg if not cached
        if (-not (Test-Path $vcpkgPath)) {
          Write-Host "Cloning vcpkg..."
          git clone https://github.com/Microsoft/vcpkg.git $vcpkgPath
        }
        
        Set-Location $vcpkgPath
        
        # Get the latest commit SHA for the baseline
        $latestCommit = git rev-parse HEAD
        Write-Host "Latest vcpkg commit: $latestCommit"
        
        # Update vcpkg.json with current baseline if needed
        $vcpkgJsonPath = "$workspace\vcpkg.json"
        if (Test-Path $vcpkgJsonPath) {
          $vcpkgJson = Get-Content $vcpkgJsonPath | ConvertFrom-Json
          $vcpkgJson.'builtin-baseline' = $latestCommit
          $vcpkgJson | ConvertTo-Json -Depth 10 | Set-Content $vcpkgJsonPath
          Write-Host "Updated vcpkg.json baseline to: $latestCommit"
        }
        
        Write-Host "Bootstrapping vcpkg..."
        .\bootstrap-vcpkg.bat
        
        # Add vcpkg to PATH and set environment variable
        Add-Content $env:GITHUB_PATH $vcpkgPath
        Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$vcpkgPath"
        
        Write-Host "vcpkg setup completed"
      shell: pwsh

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          vcpkg\installed
          vcpkg\packages
          vcpkg\buildtrees
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-v3
        restore-keys: |
          ${{ runner.os }}-vcpkg-v3

    - name: Install dependencies via vcpkg
      run: |
        $workspace = "${{ github.workspace }}"
        $vcpkgPath = "$workspace\vcpkg"
        
        Set-Location $vcpkgPath
        .\vcpkg integrate install
        
        # Use manifest mode - vcpkg will read vcpkg.json automatically
        Set-Location $workspace
        
        # Install dependencies from vcpkg.json manifest
        & "$vcpkgPath\vcpkg.exe" install --triplet=x64-windows
        
        Write-Host "Installed packages:"
        & "$vcpkgPath\vcpkg.exe" list
      shell: pwsh

    - name: Configure CMake
      run: |
        $buildDir = "${{ github.workspace }}\build"
        $toolchainFile = "${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"
        Write-Host "Build directory: $buildDir"
        Write-Host "Toolchain file: $toolchainFile"
        cmake -B $buildDir -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=$toolchainFile -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_VERBOSE_MAKEFILE=ON
      shell: pwsh

    - name: Build
      run: |
        $buildDir = "${{ github.workspace }}\build"
        Write-Host "Building in directory: $buildDir"
        cmake --build $buildDir --config ${{env.BUILD_TYPE}} --parallel --verbose
      shell: pwsh

    - name: List build output
      run: |
        $buildDir = "${{ github.workspace }}\build"
        Write-Host "Build directory contents:"
        Get-ChildItem -Recurse $buildDir -Include "*.exe", "*.dll" | ForEach-Object { Write-Host $_.FullName }
      shell: pwsh

    - name: Package application
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $buildDir = "$workspace\build"
        
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path $distDir
        Write-Host "Created distribution directory: $distDir"
        
        # Find and copy executable (check both Debug and Release folders)
        $exePaths = @(
          "$buildDir\Release\rouen.exe",
          "$buildDir\Debug\rouen.exe",
          "$buildDir\rouen.exe"
        )
        
        $exeFound = $false
        foreach ($exePath in $exePaths) {
          if (Test-Path $exePath) {
            Write-Host "Found executable at: $exePath"
            Copy-Item $exePath $distDir
            $exeFound = $true
            break
          }
        }
        
        if (-not $exeFound) {
          Write-Host "ERROR: Could not find rouen.exe in any expected location"
          Get-ChildItem -Recurse $buildDir -Include "*.exe" | ForEach-Object { Write-Host "Found exe: $($_.FullName)" }
          exit 1
        }
        
        # Copy required DLLs from vcpkg (handle errors gracefully)
        $vcpkgBinPath = "$workspace\vcpkg\installed\x64-windows\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from: $vcpkgBinPath"
          Get-ChildItem "$vcpkgBinPath\*.dll" | ForEach-Object { 
            Write-Host "Copying DLL: $($_.Name)"
            Copy-Item $_.FullName $distDir -ErrorAction SilentlyContinue 
          }
        } else {
          Write-Host "WARNING: vcpkg bin path not found: $vcpkgBinPath"
        }
        
        # Copy assets if they exist
        $imgPath = "$workspace\img"
        if (Test-Path $imgPath) {
          Copy-Item -Recurse $imgPath $distDir
          Write-Host "Copied img directory"
        }
        
        $fontsPath = "$workspace\external\fonts"
        if (Test-Path $fontsPath) {
          Copy-Item -Recurse $fontsPath $distDir
          Write-Host "Copied fonts directory"
        }
        
        # Copy individual font files
        $fontFiles = @(
          "$workspace\external\MaterialIcons-Regular.ttf",
          "$workspace\external\IconsMaterialDesign.h"
        )
        foreach ($file in $fontFiles) {
          if (Test-Path $file) {
            Copy-Item $file $distDir
            Write-Host "Copied font file: $(Split-Path -Leaf $file)"
          }
        }
        
        # Copy configuration files
        $configFiles = @(
          "$workspace\presets.txt",
          "$workspace\podcasts.txt",
          "$workspace\README.md",
          "$workspace\LICENSE"
        )
        foreach ($file in $configFiles) {
          if (Test-Path $file) {
            Copy-Item $file $distDir
            Write-Host "Copied config file: $(Split-Path -Leaf $file)"
          }
        }
        
        # List final distribution contents
        Write-Host "Final distribution contents:"
        Get-ChildItem -Recurse $distDir | ForEach-Object { Write-Host $_.FullName }

    - name: Create ZIP archive
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $distDir = "$workspace\dist"
        $zipPath = "$workspace\rouen-windows-x64.zip"
        
        Set-Location $distDir
        Compress-Archive -Path * -DestinationPath $zipPath
        Write-Host "Created ZIP archive: $zipPath"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rouen-windows-x64
        path: rouen-windows-x64.zip

    - name: Upload to release (on release event)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./rouen-windows-x64.zip
        asset_name: rouen-windows-x64.zip
        asset_content_type: application/zip

    - name: Create release (on workflow_dispatch)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          Automated Windows release build
          
          ## What's included:
          - Windows x64 executable
          - All required DLLs
          - Assets and configuration files
          - Documentation
        draft: false
        prerelease: false
        files: rouen-windows-x64.zip
