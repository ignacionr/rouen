# Unified CI for Linux and macOS using Nix

name: CI (Nix Linux & macOS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Nix
        uses: cachix/install-nix-action@v31.4.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: ${{ runner.os }}-nix-store-${{ hashFiles('flake.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-store-

      - name: Build (Nix Flake)
        run: nix build .#default --print-build-logs
        if: hashFiles('flake.nix') != ''

      - name: Run flake checks
        run: nix flake check --print-build-logs
        if: hashFiles('flake.nix') != ''

      # Fallback to legacy shell if no flake.nix is present
      - name: Build (Nix legacy)
        run: nix-shell --run "cmake -B build-nix -DCMAKE_TOOLCHAIN_FILE=cmake/nix-toolchain.cmake && cmake --build build-nix --parallel"
        if: hashFiles('flake.nix') == ''

      - name: Configure Tests (Nix legacy)
        run: nix-shell --run "mkdir -p build-tests && cd build-tests && cmake ../tests -DCMAKE_TOOLCHAIN_FILE=../cmake/nix-toolchain.cmake -DCMAKE_BUILD_TYPE=Debug"
        if: hashFiles('flake.nix') == ''

      - name: Build Tests (Nix legacy)
        run: nix-shell --run "cmake --build build-tests --parallel"
        if: hashFiles('flake.nix') == ''

      - name: Run All Tests (Nix legacy)
        run: nix-shell --run "cd build-tests && make run_all_tests"
        if: hashFiles('flake.nix') == ''

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rouen-${{ matrix.os }}-nix
          path: |
            build-nix/
            build-tests/
