name: Cross-Platform Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-matrix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            build_type: Release
          - os: macos-latest
            triplet: arm64-osx
            build_type: Release
          - os: windows-latest
            triplet: x64-windows
            build_type: Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        ./bootstrap-vcpkg.sh
        echo "${{ github.workspace }}/vcpkg" >> $GITHUB_PATH
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        echo "${{ github.workspace }}\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: pwsh

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg/installed
          ${{ github.workspace }}/vcpkg/packages
          ${{ github.workspace }}/vcpkg/buildtrees
        key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-v1
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-v1

    - name: Install dependencies via vcpkg
      run: |
        cd ${{ github.workspace }}
        ${{ env.VCPKG_ROOT }}/vcpkg install --triplet=${{ matrix.triplet }}
        ${{ env.VCPKG_ROOT }}/vcpkg list
      shell: bash

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Test build output (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        echo "Build directory contents:"
        ls -la build/
        echo "Checking for executable:"
        if [ -f build/rouen ]; then
          echo "✓ Found rouen executable"
          file build/rouen
        elif [ -d build/rouen.app ]; then
          echo "✓ Found rouen.app bundle"
          ls -la build/rouen.app/Contents/MacOS/
        else
          echo "✗ Executable not found"
          exit 1
        fi

    - name: Test build output (Windows)
      if: runner.os == 'Windows'
      run: |
        Write-Host "Build directory contents:"
        Get-ChildItem -Recurse build -Include "*.exe" | ForEach-Object { Write-Host $_.FullName }
        if (Test-Path "build/Release/rouen.exe") {
          Write-Host "✓ Found rouen.exe"
        } elseif (Test-Path "build/rouen.exe") {
          Write-Host "✓ Found rouen.exe"
        } else {
          Write-Host "✗ Executable not found"
          exit 1
        }
      shell: pwsh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rouen-${{ matrix.os }}-${{ matrix.triplet }}
        path: |
          build/rouen
          build/rouen.exe
          build/Release/rouen.exe
          build/rouen.app
        if-no-files-found: ignore

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-matrix

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        ./bootstrap-vcpkg.sh
        echo "${{ github.workspace }}/vcpkg" >> $GITHUB_PATH
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config
        cd ${{ github.workspace }}
        ${{ env.VCPKG_ROOT }}/vcpkg install --triplet=x64-linux

    - name: Configure CMake for testing
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux \
          -DBUILD_TESTING=ON

    - name: Build with tests
      run: cmake --build build --parallel

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose
